<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eee6d7" />
    <meta name="description" content="在可环绕的三维微缩小岛中游览桃林、溪流与村落。" />
    <link rel="icon" href="data:," />
    <link rel="icon" href="data:," />
    <title>桃花源记</title>
  </head>
  <body>
    <main class="experience" data-camera="island" data-night="false" data-winter="false">
      <div id="stage" class="stage" aria-label="桃花源三维场景" aria-describedby="instructions">
        <p id="scene-status" class="scene-status" role="status">正在布置桃花源…</p>
      </div>

      <header class="masthead">
        <h1>桃花源记</h1>
        <div class="environment">
          <div class="switch" role="group" aria-label="昼夜">
            <button type="button" data-light="day" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
              白天
            </button>
            <button type="button" data-light="night" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.6 8.6 0 0 1 8.8 4 8.6 8.6 0 1 0 20 15.2Z"/></svg>
              黑夜
            </button>
          </div>
          <div class="switch" role="group" aria-label="季节">
            <button type="button" data-season="spring" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10C7 8.5 8.2 3.2 12 4c3.8-.8 5 4.5 0 6Zm2 1c.9-5 6.1-5 6.5-1.4 2 3.3-2.6 6-6.5 1.4Zm-.4 2c5-.7 6.6 4.3 3.4 5.8-2.6 2.8-6.5-.8-3.4-5.8Zm-2 0c3 5-.8 8.6-3.5 5.8-3.3-1.5-1.5-6.5 3.5-5.8Zm-1.2-1.9C6.5 15.7 2 13 3.9 9.6c.5-3.6 5.7-3.6 6.5 1.5Z"/></svg>
              春季
            </button>
            <button type="button" data-season="winter" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 3 3-3M9 20l3-3 3 3M3.5 10.5l4.1-1.1-1.1-4.1m14 8.2-4.1 1.1 1.1 4.1m-11 0 1.1-4.1-4.1-1.1m14-8.2-1.1 4.1 4.1 1.1"/></svg>
              冬季
            </button>
          </div>
        </div>
      </header>

      <footer class="dock">
        <nav class="viewpoints" aria-label="游览视角">
          <button type="button" data-view="island" aria-pressed="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 18.5 9 7l3.5 6L16 6l5.5 12.5H2.5Zm4-7h5m2.8-.7h4"/></svg>
            全岛
          </button>
          <button type="button" data-view="grove" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11C6 8 8.5 3 12 5c3.5-2 6 3 0 6Zm0 0c6-3 8.5 2.7 4 4-.1 4-5.5 3.7-4-4Zm0 0c1.5 7.7-3.9 8-4 4-4.5-1.3-2-7 4-4Z"/></svg>
            桃林
          </button>
          <button type="button" data-view="village" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m2.5 11 9.5-6 9.5 6M5 10v9h14v-9M10 19v-5h4v5"/></svg>
            村落
          </button>
        </nav>
        <p class="instructions" id="instructions">
          <span class="mouse-hint">拖动环绕 <i>·</i> 滚轮缩放 <i>·</i> 划过水面泛起涟漪</span>
          <span class="touch-hint">单指环绕 <i>·</i> 双指缩放 <i>·</i> 轻点水面</span>
        </p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
